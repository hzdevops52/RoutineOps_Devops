name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t routineops-backend:${{ github.sha }} ./backend

      - name: Build frontend Docker image
        run: docker build -t routineops-frontend:${{ github.sha }} ./frontend

      - name: Deployment status
        run: |
          echo "CI/CD pipeline completed successfully."
          echo "Commit: ${{ github.sha }}"
          echo "Backend image: routineops-backend:${{ github.sha }}"
          echo "Frontend image: routineops-frontend:${{ github.sha }}"